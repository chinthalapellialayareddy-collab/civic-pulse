<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Civic Issues – CivicPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header id="main-header"></header>

  <div style="background: linear-gradient(135deg, var(--primary-navy-dark), var(--primary-navy)); color: white; padding: 2.5rem 1.5rem 2rem;">
    <div class="cp-container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.35rem;" data-i18n="nav_public_issues">Public Civic Issues</h1>
        <p style="color: #cbd5e1; font-size: 0.95rem;">Track, support, and inspect transparent civic issues submitted across the city.</p>
      </div>
      <div style="display: flex; gap: 0.75rem;">
        <a href="/public-map.html" class="btn btn-secondary">
          <i class="fas fa-map"></i> View Map View
        </a>
        <a href="/report-issue.html" class="btn btn-primary">
          <i class="fas fa-plus"></i> Report Issue
        </a>
      </div>
    </div>
  </div>

  <main class="cp-container" style="padding: 2rem 1.5rem;">
    <!-- Filter and Search Bar -->
    <div class="cp-card" style="margin-bottom: 2rem; padding: 1.25rem;">
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 1rem; align-items: center;">
        <div>
          <input type="text" id="search-input" class="form-control" placeholder="Search by title, location or complaint ID..." oninput="handleSearch()">
        </div>
        <div>
          <select id="filter-category" class="form-select" onchange="loadComplaints()">
            <option value="All">All Categories</option>
            <option value="Road Damage">Road Damage</option>
            <option value="Garbage Overflow">Garbage Overflow</option>
            <option value="Water Leakage">Water Leakage</option>
            <option value="Streetlight Failure">Streetlight Failure</option>
            <option value="Drainage Problems">Drainage Problems</option>
            <option value="Public Infrastructure">Public Infrastructure</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <select id="filter-status" class="form-select" onchange="loadComplaints()">
            <option value="All">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Reviewed">Reviewed</option>
            <option value="Assigned">Assigned</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
        <div>
          <button class="btn btn-secondary" onclick="resetFilters()">
            <i class="fas fa-redo"></i> Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Complaints Grid -->
    <div id="complaints-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
      <!-- Dynamic list loaded via JS -->
    </div>

    <!-- Pagination Controls -->
    <div id="pagination-controls" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 2.5rem;"></div>
  </main>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let currentPage = 1;
    let searchTimeout = null;

    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentPage = 1;
        loadComplaints();
      }, 350);
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-category').value = 'All';
      document.getElementById('filter-status').value = 'All';
      currentPage = 1;
      loadComplaints();
    }

    async function loadComplaints() {
      const grid = document.getElementById('complaints-grid');
      grid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
          <i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--teal);"></i>
          <p style="margin-top: 0.5rem; color: var(--text-muted);">Loading civic issues...</p>
        </div>
      `;

      const search = document.getElementById('search-input').value;
      const category = document.getElementById('filter-category').value;
      const status = document.getElementById('filter-status').value;

      try {
        const queryParams = new URLSearchParams({
          page: currentPage,
          limit: 9,
          category,
          status,
          search
        });

        const res = await api.get(`/public/complaints?${queryParams.toString()}`);
        if (res.success) {
          if (res.complaints.length === 0) {
            grid.innerHTML = `
              <div class="cp-card" style="grid-column: 1/-1; text-align: center; padding: 4rem;">
                <i class="fas fa-search fa-3x" style="color: var(--text-light); margin-bottom: 1rem;"></i>
                <h3>No Complaints Found</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Try adjusting your filters or search keywords.</p>
                <button class="btn btn-outline" onclick="resetFilters()">Reset All Filters</button>
              </div>
            `;
            document.getElementById('pagination-controls').innerHTML = '';
            return;
          }

          grid.innerHTML = res.complaints.map(c => `
            <div class="cp-card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
              <div style="height: 190px; background: #e2e8f0; position: relative;">
                <img src="${c.image_url || 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=600'}" alt="${c.title}" style="width: 100%; height: 100%; object-fit: cover;">
                <span class="status-badge ${c.status.replace(/\s+/g, '')}" style="position: absolute; top: 12px; right: 12px;">
                  ${c.status}
                </span>
                <span class="priority-badge priority-${c.priority}" style="position: absolute; top: 12px; left: 12px;">
                  ${c.priority} Priority
                </span>
              </div>
              <div style="padding: 1.25rem; flex: 1; display: flex; flex-direction: column;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                  <span style="font-size: 0.75rem; color: var(--teal); font-weight: 700; text-transform: uppercase;">
                    ${c.category}
                  </span>
                  <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">
                    ${c.complaint_id}
                  </span>
                </div>
                <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 0.5rem; line-height: 1.35;">
                  ${c.title}
                </h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.85rem; line-height: 1.5;">
                  ${c.description.length > 110 ? c.description.substring(0, 110) + '...' : c.description}
                </p>
                <p style="color: #475569; font-size: 0.8rem; margin-bottom: 1rem;">
                  <i class="fas fa-map-marker-alt" style="color: var(--red);"></i> ${c.address}
                </p>

                <div style="margin-top: auto; padding-top: 0.85rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                  <button onclick="supportComplaint(${c.id})" class="btn btn-outline btn-sm" style="padding: 0.35rem 0.7rem; font-size: 0.8rem;">
                    <i class="fas fa-thumbs-up" style="color: var(--bright-blue);"></i> Support (${c.support_count || 0})
                  </button>
                  <a href="/complaint-details?id=${c.complaint_id}" onclick="sessionStorage.setItem('current_tracking_id', '${c.complaint_id}'); localStorage.setItem('current_tracking_id', '${c.complaint_id}');" class="btn btn-navy btn-sm">
                    Timeline <i class="fas fa-arrow-right"></i>
                  </a>
                </div>
              </div>
            </div>
          `).join('');

          // Render Pagination
          renderPagination(res.page, res.totalPages);
        }
      } catch (err) {
        grid.innerHTML = `<div class="cp-card" style="grid-column: 1/-1; text-align: center; color: var(--red); padding: 2rem;">Error: ${err.message}</div>`;
      }
    }

    function renderPagination(page, totalPages) {
      const controls = document.getElementById('pagination-controls');
      if (totalPages <= 1) {
        controls.innerHTML = '';
        return;
      }

      let html = '';
      if (page > 1) {
        html += `<button class="btn btn-secondary btn-sm" onclick="goToPage(${page - 1})"><i class="fas fa-chevron-left"></i> Prev</button>`;
      }
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-secondary'}" onclick="goToPage(${i})">${i}</button>`;
      }
      if (page < totalPages) {
        html += `<button class="btn btn-secondary btn-sm" onclick="goToPage(${page + 1})">Next <i class="fas fa-chevron-right"></i></button>`;
      }
      controls.innerHTML = html;
    }

    function goToPage(p) {
      currentPage = p;
      loadComplaints();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function supportComplaint(id) {
      if (!api.getToken()) {
        showToast('Please login to upvote/support this civic complaint.', 'warning');
        setTimeout(() => window.location.href = '/login.html', 1500);
        return;
      }
      try {
        const res = await api.post(`/complaints/${id}/support`, {});
        showToast(res.message, res.supported ? 'success' : 'info');
        loadComplaints();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadComplaints);
  </script>
</body>
</html>
