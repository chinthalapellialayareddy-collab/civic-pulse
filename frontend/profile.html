<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile – CivicPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header id="main-header"></header>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div style="padding: 0.5rem 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 0.5rem;">
        <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase;">Citizen Portal</div>
        <div id="user-display-name" style="font-weight: 700; color: #ffffff; font-size: 1.1rem;">Citizen</div>
      </div>
      <a href="/citizen-dashboard.html" class="sidebar-link">
        <i class="fas fa-columns"></i> <span>Overview</span>
      </a>
      <a href="/report-issue.html" class="sidebar-link">
        <i class="fas fa-plus-circle" style="color: var(--teal-light);"></i> <span>Report New Issue</span>
      </a>
      <a href="/my-complaints.html" class="sidebar-link">
        <i class="fas fa-folder-open"></i> <span>My Complaints</span>
      </a>
      <a href="/notifications.html" class="sidebar-link">
        <i class="fas fa-bell"></i> <span>Notifications</span>
      </a>
      <a href="/profile.html" class="sidebar-link active">
        <i class="fas fa-user-cog"></i> <span>Profile & Settings</span>
      </a>
    </aside>

    <main class="dashboard-content">
      <div style="max-width: 700px; margin: 0 auto;">
        <div style="margin-bottom: 2rem;">
          <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--primary-navy);">Account & Profile Settings</h1>
          <p style="color: var(--text-muted);">Manage your personal information and contact preferences</p>
        </div>

        <div class="cp-card">
          <div style="display: flex; gap: 1.5rem; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem;">
            <div style="width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), var(--bright-blue)); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700;">
              <span id="avatar-initials">U</span>
            </div>
            <div>
              <h2 id="profile-name" style="font-size: 1.4rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 0.25rem;">Citizen Name</h2>
              <div style="display: flex; gap: 0.5rem; align-items: center;">
                <span id="profile-role" class="status-badge Assigned">Citizen</span>
                <span id="profile-email-badge" style="font-size: 0.85rem; color: var(--text-muted);">user@example.com</span>
              </div>
            </div>
          </div>

          <form id="profile-form" onsubmit="updateProfile(event)">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="name-input" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label">Email Address (Immutable)</label>
              <input type="email" id="email-input" class="form-control" readonly style="background: #f1f5f9; cursor: not-allowed;">
            </div>

            <div class="form-group">
              <label class="form-label">Mobile Number</label>
              <input type="tel" id="mobile-input" class="form-control" placeholder="10-digit mobile number">
            </div>

            <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end;">
              <button type="submit" id="save-btn" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const user = requireAuth();

    function populateProfile() {
      if (!user) return;
      document.getElementById('user-display-name').textContent = user.name;
      document.getElementById('profile-name').textContent = user.name;
      document.getElementById('avatar-initials').textContent = user.name.charAt(0).toUpperCase();
      document.getElementById('profile-role').textContent = user.role;
      document.getElementById('profile-email-badge').textContent = user.email;

      document.getElementById('name-input').value = user.name;
      document.getElementById('email-input').value = user.email;
      document.getElementById('mobile-input').value = user.mobile || '';
    }

    async function updateProfile(e) {
      e.preventDefault();
      const name = document.getElementById('name-input').value;
      const mobile = document.getElementById('mobile-input').value;
      const btn = document.getElementById('save-btn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving...';

      try {
        const res = await api.put('/auth/profile', { name, mobile });
        if (res.success) {
          user.name = name;
          user.mobile = mobile;
          api.setUser(user);
          showToast('Profile updated successfully!', 'success');
          populateProfile();
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
      }
    }

    document.addEventListener('DOMContentLoaded', populateProfile);
  </script>
</body>
</html>
