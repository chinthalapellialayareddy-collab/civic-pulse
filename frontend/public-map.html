<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Public Map – CivicPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    #map {
      height: calc(100vh - 160px);
      min-height: 520px;
      width: 100%;
      border-radius: var(--radius-md);
      z-index: 10;
    }
    .custom-marker-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      border-radius: 50%;
      font-weight: bold;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    .marker-pending { background: #ef4444; }
    .marker-reviewed { background: #7c3aed; }
    .marker-assigned { background: #0284c7; }
    .marker-inprogress { background: #f59e0b; }
    .marker-resolved { background: #16a34a; }
  </style>
</head>
<body>
  <header id="main-header"></header>

  <div style="background: white; border-bottom: 1px solid var(--border-color); padding: 0.75rem 1.5rem;">
    <div class="cp-container" style="padding: 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <h2 style="font-size: 1.3rem; font-weight: 800; color: var(--primary-navy); margin: 0;">
          <i class="fas fa-map-marked-alt" style="color: var(--teal);"></i> Civic Complaints Heatmap
        </h2>
        <span id="markers-count-badge" class="status-badge Assigned" style="font-size: 0.75rem;">Loading points...</span>
      </div>

      <!-- Filters & Locators -->
      <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
        <button onclick="locateUser()" class="btn btn-secondary btn-sm" title="My Current Geolocation">
          <i class="fas fa-crosshairs"></i> My Location
        </button>
        <select id="map-filter-category" class="form-select" style="padding: 0.4rem 0.75rem; font-size: 0.85rem; width: auto;" onchange="loadMapPoints()">
          <option value="All">All Categories</option>
          <option value="Road Damage">Road Damage</option>
          <option value="Garbage Overflow">Garbage Overflow</option>
          <option value="Water Leakage">Water Leakage</option>
          <option value="Streetlight Failure">Streetlight Failure</option>
          <option value="Drainage Problems">Drainage Problems</option>
          <option value="Public Infrastructure">Public Infrastructure</option>
        </select>
        <select id="map-filter-status" class="form-select" style="padding: 0.4rem 0.75rem; font-size: 0.85rem; width: auto;" onchange="loadMapPoints()">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
        <a href="/report-issue.html" class="btn btn-primary btn-sm">
          <i class="fas fa-plus"></i> Report
        </a>
      </div>
    </div>
  </div>

  <main class="cp-container" style="padding: 1.5rem; flex: 1; display: flex; flex-direction: column;">
    <!-- Map Legend -->
    <div style="display: flex; align-items: center; gap: 1.25rem; margin-bottom: 0.75rem; flex-wrap: wrap; background: white; padding: 0.6rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 0.85rem; font-weight: 600;">
      <span style="color: var(--text-muted);"><i class="fas fa-info-circle"></i> Legend:</span>
      <span style="display: inline-flex; align-items: center; gap: 0.35rem;"><span style="width: 12px; height: 12px; border-radius: 50%; background: #ef4444;"></span> Pending (Red)</span>
      <span style="display: inline-flex; align-items: center; gap: 0.35rem;"><span style="width: 12px; height: 12px; border-radius: 50%; background: #f59e0b;"></span> In Progress (Orange)</span>
      <span style="display: inline-flex; align-items: center; gap: 0.35rem;"><span style="width: 12px; height: 12px; border-radius: 50%; background: #16a34a;"></span> Resolved (Green)</span>
      <span style="display: inline-flex; align-items: center; gap: 0.35rem; margin-left: auto; color: var(--text-muted); font-size: 0.75rem;">&copy; OpenStreetMap Contributors</span>
    </div>

    <div id="map"></div>
  </main>

  <footer id="main-footer"></footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let map = null;
    let markersLayer = null;
    let userMarker = null;

    function initMap() {
      // Centered on Hyderabad
      map = L.map('map').setView([17.4100, 78.4200], 12);

      // OpenStreetMap Tiles with attribution
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      loadMapPoints();
    }

    async function loadMapPoints() {
      if (!markersLayer) return;
      markersLayer.clearLayers();

      const category = document.getElementById('map-filter-category').value;
      const status = document.getElementById('map-filter-status').value;

      try {
        const res = await api.get(`/public/map?category=${category}&status=${status}`);
        if (res.success) {
          document.getElementById('markers-count-badge').textContent = `${res.count} Geo-tagged Issues`;

          const bounds = [];

          res.markers.forEach(m => {
            if (!m.latitude || !m.longitude) return;

            let markerClass = 'marker-pending';
            if (m.status === 'In Progress') markerClass = 'marker-inprogress';
            else if (m.status === 'Resolved') markerClass = 'marker-resolved';
            else if (m.status === 'Assigned') markerClass = 'marker-assigned';

            const icon = L.divIcon({
              className: 'custom-pin',
              html: `<div class="custom-marker-icon ${markerClass}" style="width: 28px; height: 28px; font-size: 12px;"><i class="fas fa-exclamation"></i></div>`,
              iconSize: [28, 28],
              iconAnchor: [14, 14]
            });

            const marker = L.marker([m.latitude, m.longitude], { icon });

            const popupContent = `
              <div style="font-family: 'Plus Jakarta Sans', sans-serif; max-width: 260px;">
                <div style="position: relative; margin: -14px -14px 10px -14px; height: 120px; overflow: hidden; border-radius: 4px 4px 0 0;">
                  <img src="${m.image_url || 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=500'}" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div style="font-size: 11px; font-weight: 700; color: #0d9488; text-transform: uppercase;">${m.category} &bull; ${m.complaint_id}</div>
                <h4 style="margin: 4px 0; font-size: 14px; font-weight: 700; color: #172554;">${m.title}</h4>
                <p style="font-size: 12px; color: #64748b; margin: 4px 0 8px 0;"><i class="fas fa-map-marker-alt" style="color: #ef4444;"></i> ${m.address}</p>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                  <span class="status-badge ${m.status.replace(/\s+/g, '')}" style="font-size: 10px; padding: 2px 6px;">${m.status}</span>
                  <a href="/complaint-details?id=${m.complaint_id}" onclick="sessionStorage.setItem('current_tracking_id', '${m.complaint_id}'); localStorage.setItem('current_tracking_id', '${m.complaint_id}');" style="color: #3b82f6; font-size: 12px; font-weight: 600; text-decoration: underline;">View Timeline &rarr;</a>
                </div>
              </div>
            `;

            marker.bindPopup(popupContent);
            markersLayer.addLayer(marker);
            bounds.push([m.latitude, m.longitude]);
          });

          if (bounds.length > 0 && category === 'All' && status === 'All') {
            map.fitBounds(bounds, { padding: [50, 50] });
          }
        }
      } catch (err) {
        showToast('Failed to load map markers: ' + err.message, 'error');
      }
    }

    function locateUser() {
      if (!navigator.geolocation) {
        showToast('Geolocation is not supported by your browser.', 'error');
        return;
      }

      showToast('Acquiring your GPS location...', 'info');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          if (userMarker) {
            map.removeLayer(userMarker);
          }

          const userIcon = L.divIcon({
            html: '<div style="background: #2563eb; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(37,99,235,0.8);"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });

          userMarker = L.marker([lat, lon], { icon: userIcon }).addTo(map);
          userMarker.bindPopup('<b>Your Current Location</b>').openPopup();
          map.setView([lat, lon], 14);
          showToast('Location identified.', 'success');
        },
        (err) => {
          showToast('Could not retrieve your location. Permission denied or GPS unavailable.', 'warning');
        },
        { timeout: 10000, enableHighAccuracy: true }
      );
    }

    document.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
