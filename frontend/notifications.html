<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications – CivicPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header id="main-header"></header>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div style="padding: 0.5rem 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 0.5rem;">
        <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase;">Citizen Portal</div>
        <div id="user-display-name" style="font-weight: 700; color: #ffffff; font-size: 1.1rem;">Citizen</div>
      </div>
      <a href="/citizen-dashboard.html" class="sidebar-link">
        <i class="fas fa-columns"></i> <span>Overview</span>
      </a>
      <a href="/report-issue.html" class="sidebar-link">
        <i class="fas fa-plus-circle" style="color: var(--teal-light);"></i> <span>Report New Issue</span>
      </a>
      <a href="/my-complaints.html" class="sidebar-link">
        <i class="fas fa-folder-open"></i> <span>My Complaints</span>
      </a>
      <a href="/notifications.html" class="sidebar-link active">
        <i class="fas fa-bell"></i> <span>Notifications</span>
      </a>
      <a href="/profile.html" class="sidebar-link">
        <i class="fas fa-user-cog"></i> <span>Profile & Settings</span>
      </a>
    </aside>

    <main class="dashboard-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--primary-navy);">Notifications Center</h1>
          <p style="color: var(--text-muted);">Real-time alerts, department dispatches, and grievance updates</p>
        </div>
        <button onclick="markAllAsRead()" class="btn btn-secondary btn-sm" style="color: var(--primary-navy); background: white; border: 1px solid var(--border-color);">
          <i class="fas fa-check-double"></i> Mark All as Read
        </button>
      </div>

      <div id="notifications-list" class="cp-card" style="padding: 0; overflow: hidden;">
        <div style="text-align: center; padding: 3rem;">
          <i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--teal);"></i>
          <p style="margin-top: 0.5rem; color: var(--text-muted);">Loading notification inbox...</p>
        </div>
      </div>
    </main>
  </div>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const user = requireAuth();
    if (user) {
      document.getElementById('user-display-name').textContent = user.name;
    }

    async function loadNotifications() {
      const container = document.getElementById('notifications-list');
      try {
        const res = await api.get('/notifications');
        if (res.success) {
          if (res.notifications.length === 0) {
            container.innerHTML = `
              <div style="text-align: center; padding: 4rem;">
                <i class="fas fa-bell-slash fa-3x" style="color: var(--text-light); margin-bottom: 1rem;"></i>
                <h3 style="font-weight: 700; color: var(--primary-navy);">No Notifications</h3>
                <p style="color: var(--text-muted);">You're all caught up! New updates on your civic reports will appear here.</p>
              </div>
            `;
            return;
          }

          container.innerHTML = res.notifications.map(n => `
            <div style="padding: 1.25rem; border-bottom: 1px solid var(--border-color); display: flex; gap: 1rem; align-items: flex-start; background: ${n.is_read ? 'white' : '#f0fdfa'}; transition: var(--transition);">
              <div style="width: 38px; height: 38px; border-radius: 50%; background: ${n.is_read ? '#e2e8f0' : 'var(--teal)'}; color: ${n.is_read ? '#64748b' : 'white'}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <i class="fas fa-bell"></i>
              </div>
              <div style="flex: 1;">
                <p style="margin: 0; font-weight: ${n.is_read ? '500' : '700'}; color: var(--primary-navy); font-size: 0.95rem;">
                  ${n.message}
                </p>
                <div style="font-size: 0.75rem; color: var(--text-light); margin-top: 0.35rem;">
                  ${new Date(n.created_at).toLocaleString()}
                </div>
              </div>
              <div style="display: flex; gap: 0.5rem; align-items: center;">
                ${n.complaint_id ? `
                  <a href="/complaint-details?id=${n.complaint_id}" onclick="sessionStorage.setItem('current_tracking_id', '${n.complaint_id}'); localStorage.setItem('current_tracking_id', '${n.complaint_id}');" class="btn btn-outline btn-sm" style="font-size: 0.75rem; padding: 0.25rem 0.6rem;">
                    View
                  </a>
                ` : ''}
                ${!n.is_read ? `
                  <button onclick="markAsRead(${n.id})" class="btn btn-secondary btn-sm" style="font-size: 0.75rem; padding: 0.25rem 0.6rem;">
                    <i class="fas fa-check"></i>
                  </button>
                ` : ''}
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        container.innerHTML = `<div style="padding: 2rem; color: var(--red); text-align: center;">Error: ${err.message}</div>`;
      }
    }

    async function markAsRead(id) {
      try {
        await api.patch(`/notifications/${id}/read`, {});
        loadNotifications();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function markAllAsRead() {
      try {
        await api.patch('/notifications/read-all', {});
        showToast('All notifications marked as read.', 'success');
        loadNotifications();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadNotifications);
  </script>
</body>
</html>
