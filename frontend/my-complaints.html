<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Complaints – CivicPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header id="main-header"></header>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div style="padding: 0.5rem 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 0.5rem;">
        <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase;">Citizen Portal</div>
        <div id="user-display-name" style="font-weight: 700; color: #ffffff; font-size: 1.1rem;">Citizen</div>
      </div>
      <a href="/citizen-dashboard.html" class="sidebar-link">
        <i class="fas fa-columns"></i> <span>Overview</span>
      </a>
      <a href="/report-issue.html" class="sidebar-link">
        <i class="fas fa-plus-circle" style="color: var(--teal-light);"></i> <span>Report New Issue</span>
      </a>
      <a href="/my-complaints.html" class="sidebar-link active">
        <i class="fas fa-folder-open"></i> <span>My Complaints</span>
      </a>
      <a href="/notifications.html" class="sidebar-link">
        <i class="fas fa-bell"></i> <span>Notifications</span>
      </a>
      <a href="/profile.html" class="sidebar-link">
        <i class="fas fa-user-cog"></i> <span>Profile & Settings</span>
      </a>
    </aside>

    <main class="dashboard-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--primary-navy);" data-i18n="my_complaints">My Submitted Complaints</h1>
          <p style="color: var(--text-muted);">View complete record of your grievances and their resolution milestones</p>
        </div>
        <a href="/report-issue.html" class="btn btn-primary">
          <i class="fas fa-plus"></i> Lodge New Grievance
        </a>
      </div>

      <!-- Complaints List Container -->
      <div id="complaints-list" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="cp-card" style="text-align: center; padding: 3rem;">
          <i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--teal);"></i>
          <p style="margin-top: 0.5rem; color: var(--text-muted);">Fetching your grievance history...</p>
        </div>
      </div>
    </main>
  </div>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const user = requireAuth('Citizen');
    if (user) {
      document.getElementById('user-display-name').textContent = user.name;
    }

    async function loadMyComplaints() {
      const container = document.getElementById('complaints-list');
      try {
        const res = await api.get('/complaints/my');
        if (res.success) {
          if (res.complaints.length === 0) {
            container.innerHTML = `
              <div class="cp-card" style="text-align: center; padding: 4rem;">
                <i class="fas fa-folder-open fa-3x" style="color: var(--text-light); margin-bottom: 1rem;"></i>
                <h3 style="font-weight: 700; color: var(--primary-navy);">No Grievances Lodged Yet</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">You haven't submitted any civic issues in the portal yet.</p>
                <a href="/report-issue.html" class="btn btn-primary"><i class="fas fa-plus"></i> Report Issue</a>
              </div>
            `;
            return;
          }

          container.innerHTML = res.complaints.map(c => `
            <div class="cp-card" style="display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center;">
              <div style="width: 140px; height: 110px; border-radius: var(--radius-sm); overflow: hidden; background: #e2e8f0; flex-shrink: 0;">
                <img src="${c.image_url || 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=400'}" style="width: 100%; height: 100%; object-fit: cover;">
              </div>

              <div style="flex: 1; min-width: 260px;">
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.35rem; flex-wrap: wrap;">
                  <span style="font-weight: 800; color: var(--primary-navy); font-size: 0.95rem;">#${c.complaint_id}</span>
                  <span class="status-badge Assigned" style="font-size: 0.75rem;">${c.category}</span>
                  <span class="priority-badge priority-${c.priority}">${c.priority}</span>
                  <span class="status-badge ${c.status.replace(/\s+/g, '')}">${c.status}</span>
                </div>
                <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 0.35rem;">
                  ${c.title}
                </h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem;">
                  <i class="fas fa-map-marker-alt" style="color: var(--red);"></i> ${c.address}
                </p>
                <div style="font-size: 0.8rem; color: var(--text-light);">
                  <span>Submitted on ${new Date(c.created_at).toLocaleDateString()}</span>
                  ${c.department_name ? ` &bull; <strong style="color: #475569;">${c.department_name}</strong>` : ''}
                </div>
              </div>

              <div>
                <a href="/complaint-details?id=${c.complaint_id}" onclick="sessionStorage.setItem('current_tracking_id', '${c.complaint_id}'); localStorage.setItem('current_tracking_id', '${c.complaint_id}');" class="btn btn-navy btn-sm" style="white-space: nowrap;">
                  View Live Tracking <i class="fas fa-chevron-right"></i>
                </a>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        container.innerHTML = `<div class="cp-card" style="color: var(--red); text-align: center;">Error: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadMyComplaints);
  </script>
</body>
</html>
