<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Recovery – CivicPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, var(--bg-slate) 0%, #e2e8f0 100%); min-height: 100vh;">
  <header id="main-header"></header>

  <main class="cp-container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 180px); padding: 2rem 1.5rem;">
    <div class="cp-card" style="width: 100%; max-width: 440px; padding: 2.5rem; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 50px; height: 50px; background: #fee2e2; color: var(--red); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
          <i class="fas fa-key"></i>
        </div>
        <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--primary-navy);">Recover Password</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">Enter your verified email to receive instructions</p>
      </div>

      <form id="recover-form" onsubmit="handleRecover(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div style="position: relative;">
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required style="padding-left: 2.75rem;">
            <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
          </div>
        </div>

        <button type="submit" id="recover-btn" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem;">
          <i class="fas fa-paper-plane"></i> Send Recovery Instructions
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        Remember your password? <a href="/login.html" style="color: var(--teal); font-weight: 700;">Back to login</a>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/components.js"></script>
  <script>
    async function handleRecover(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = document.getElementById('recover-btn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';

      try {
        const res = await api.post('/auth/forgot-password', { email });
        showToast(res.message, 'success');
        document.getElementById('email').value = '';
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Recovery Instructions';
      }
    }
  </script>
</body>
</html>
